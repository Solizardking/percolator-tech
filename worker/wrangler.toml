# Live apex worker. Do not wrangler-deploy this file without the existing
# Workers Assets bundle and secret bindings — that would drop the Vite app.
# Deploys must update worker script content only and keep ASSETS + secrets.
# Add AUTH_UPSTREAM as a plain-text binding (Railway origin, no path). Do
# not put BETTER_AUTH_SECRET or BETTER_AUTH_API_KEY on this Worker; those
# belong on the Railway auth service only.
name = "percolator-tech"
main = "src/worker.js"
compatibility_date = "2026-11-09"
account_id = "7640372571bf2d69ed5d58a6a6d8929e"
workers_dev = false

# AUTH_UPSTREAM is set on the live Worker at deploy time, not committed here,
# so a preview deploy cannot accidentally proxy to production auth.
# [vars]
# AUTH_UPSTREAM = "https://<railway-domain>"
